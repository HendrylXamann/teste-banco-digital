services:
  postgres:
    image: postgres:16-alpine
    container_name: bank-postgres
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: bank-app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bank
      DB_USER: bank
      DB_PASSWORD: bank
      NOTIFICATION_FAILURE_RATE: ${NOTIFICATION_FAILURE_RATE:-0.0}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
